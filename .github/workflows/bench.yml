# Cross-platform benchmarks for Stratum Sort.
#
# 0.10.0 published timings from one machine, and this project has seen
# timing conclusions invert between machines more than once. This workflow
# runs benchmarks/stratum_bench.cpp on the three platforms CI already
# verifies for correctness - Linux x86_64, macOS arm64, Windows x86_64 -
# and keeps the full report (Markdown + CSV) as an artifact and in the job
# log.
#
# GitHub-hosted runners are shared virtual machines: absolute milliseconds
# from them are noisy and are NOT quotable as the speed of a machine. What
# the benchmark reports that DOES travel is the ratio to std::sort, because
# both sorts run alternately on identical copies of the same input in the
# same process, and the dispersion (p10-p90) says how much to trust it.
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "quick | ci | types | lambda | memory | full | tune"
        required: false
        default: "ci"
  push:
    branches: [v11-dev, 'claude/**']
    paths:
      - 'include/**'
      - 'benchmarks/**'
      - 'datasets/**'
      - '.github/workflows/bench.yml'

jobs:
  bench:
    name: bench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release)
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DSTRATUMSORT_BUILD_TESTS=OFF -DSTRATUMSORT_BUILD_EXAMPLES=OFF
          -DSTRATUMSORT_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --config Release --target stratum_bench --parallel

      - name: Run
        shell: bash
        run: |
          exe="$(find build -name 'stratum_bench' -o -name 'stratum_bench.exe' | head -1)"
          suite="${{ github.event.inputs.suite || 'ci' }}"
          "$exe" --suite "$suite" --md "bench-${{ runner.os }}-${{ runner.arch }}.md" \
                 --csv "bench-${{ runner.os }}-${{ runner.arch }}.csv"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ runner.os }}-${{ runner.arch }}
          path: |
            bench-*.md
            bench-*.csv

  # The in-place engine's constants (L, block size) measured on the runners
  # themselves: research/perf/InPlaceTuning.cpp built once per configuration
  # against a copy of include/ with the two constants edited. Runs when the
  # commit message contains [tune], or on dispatch with suite = tune. Not on
  # Windows: the loop below needs a compiler on PATH, which the MSVC runner
  # only has inside a developer shell.
  tune:
    name: tune / ${{ matrix.os }}
    if: contains(github.event.head_commit.message, '[tune]') || github.event.inputs.suite == 'tune'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build and run every (L, block) configuration
        shell: bash
        run: |
          out="tune-${{ runner.os }}-${{ runner.arch }}.md"
          for cfg in "10 512" "10 256" "10 128" "9 512" "9 256" "8 512" "8 256" "8 1024"; do
            set -- $cfg
            d="inc_$1_$2"
            rm -rf "$d"
            cp -r include "$d"
            sed -i.bak "s/constexpr unsigned INPLACE_RADIX_BITS = 10;/constexpr unsigned INPLACE_RADIX_BITS = $1;/; s/constexpr std::size_t INPLACE_BLOCK_BYTES = 512;/constexpr std::size_t INPLACE_BLOCK_BYTES = $2;/" "$d/stratum/Config.hpp"
            grep -q "INPLACE_RADIX_BITS = $1;" "$d/stratum/Config.hpp"
            grep -q "INPLACE_BLOCK_BYTES = $2;" "$d/stratum/Config.hpp"
            c++ -std=c++17 -O3 -DNDEBUG -I"$d" -Idatasets -Ibenchmarks research/perf/InPlaceTuning.cpp -o "tune_$1_$2"
            "./tune_$1_$2" | tee -a "$out"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tune-${{ runner.os }}-${{ runner.arch }}
          path: tune-*.md
